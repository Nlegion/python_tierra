[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytierra"
version = "0.1.0"
description = "Python Tierra-VM MVP (derivative of Tierra Simulator v6.02)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "vulture>=2.11",
]

[tool.setuptools.packages.find]
include = ["pytierra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["pytierra"]
omit = ["pytierra/__init__.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "assert False",
]

[tool.bandit]
exclude_dirs = ["legacy", "tests", "examples"]
skips = ["B404", "B603", "B607"]

[tool.vulture]
min_confidence = 80
